server:
  port: ${SERVER_PORT:8080}
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: ai-coding-platform

  # ---- 数据源 ----
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ai_coding_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ---- Flyway 数据库迁移 ----
  flyway:
    enabled: true
    locations: classpath:db/migration

  # ---- Jackson ----
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSXXX
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# ---- MyBatis-Plus ----
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:mapper/**/*.xml

# ---- Actuator ----
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: AI Coding Platform
    version: 0.0.1-SNAPSHOT
    description: Enterprise AI Coding Collaboration Platform

# ---- 日志 ----
logging:
  level:
    root: INFO
    com.aicoding.platform: DEBUG

# ---- 自定义配置 ----
app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expire-seconds: ${JWT_ACCESS_EXPIRE:7200}
    refresh-token-expire-seconds: ${JWT_REFRESH_EXPIRE:604800}
  workspace:
    root-path: ${WORKSPACE_ROOT:./workspace}
  model-gateway:
    default-provider: ${MODEL_GATEWAY_PROVIDER:MOCK}
    fallback-provider: MOCK
    fallback-enabled: true
    timeout-ms: ${MODEL_GATEWAY_TIMEOUT_MS:30000}
    retry-times: ${MODEL_GATEWAY_RETRY_TIMES:1}
    prompt-safety-enabled: true
    providers:
      mock:
        enabled: true
        model-name: mock-agent-model
      openai:
        enabled: ${OPENAI_ENABLED:false}
        base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
        api-key: ${OPENAI_API_KEY:}
        model-name: ${OPENAI_MODEL:gpt-4.1-mini}
      deepseek:
        enabled: ${DEEPSEEK_ENABLED:false}
        base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
        api-key: ${DEEPSEEK_API_KEY:}
        model-name: ${DEEPSEEK_MODEL:deepseek-chat}
      qwen:
        enabled: ${QWEN_ENABLED:false}
        base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        api-key: ${QWEN_API_KEY:}
        model-name: ${QWEN_MODEL:qwen-plus}
      claude:
        enabled: ${CLAUDE_ENABLED:false}
        base-url: ${CLAUDE_BASE_URL:https://api.anthropic.com}
        api-key: ${CLAUDE_API_KEY:}
        model-name: ${CLAUDE_MODEL:claude-3-5-sonnet-latest}
  rag:
    enabled: true
    chat-enabled: true
    agent-enabled: true
    default-limit: 5
    max-context-chars: 4000
    max-chunk-chars: 800

