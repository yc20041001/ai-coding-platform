server:
  port: ${SERVER_PORT:8080}
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: ai-coding-platform

  # ---- 数据源 ----
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ai_coding_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ---- Flyway 数据库迁移 ----
  flyway:
    enabled: true
    locations: classpath:db/migration

  # ---- Jackson ----
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSXXX
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  # ---- Redis ----
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 3000ms

  # ---- RabbitMQ ----
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:${RABBITMQ_HOST:localhost}}
    port: ${SPRING_RABBITMQ_PORT:${RABBITMQ_PORT:5672}}
    username: ${SPRING_RABBITMQ_USERNAME:${RABBITMQ_USERNAME:guest}}
    password: ${SPRING_RABBITMQ_PASSWORD:${RABBITMQ_PASSWORD:guest}}
    virtual-host: ${SPRING_RABBITMQ_VIRTUAL_HOST:${RABBITMQ_VIRTUAL_HOST:/}}

# ---- MyBatis-Plus ----
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath:mapper/**/*.xml

# ---- Actuator ----
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: AI Coding Platform
    version: 0.0.1-SNAPSHOT
    description: Enterprise AI Coding Collaboration Platform

# ---- 日志 ----
logging:
  level:
    root: INFO
    com.aicoding.platform: DEBUG

# ---- 自定义配置 ----
app:
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expire-seconds: ${JWT_ACCESS_EXPIRE:7200}
    refresh-token-expire-seconds: ${JWT_REFRESH_EXPIRE:604800}
  auth:
    captcha:
      enabled: ${AUTH_CAPTCHA_ENABLED:true}
      store: ${AUTH_CAPTCHA_STORE:redis}
      expire-seconds: ${AUTH_CAPTCHA_EXPIRE_SECONDS:120}
      length: ${AUTH_CAPTCHA_LENGTH:4}
      max-attempts: ${AUTH_CAPTCHA_MAX_ATTEMPTS:3}
      width: ${AUTH_CAPTCHA_WIDTH:120}
      height: ${AUTH_CAPTCHA_HEIGHT:40}
    login-protection:
      enabled: ${AUTH_LOGIN_PROTECTION_ENABLED:true}
      max-email-failures: ${AUTH_LOGIN_MAX_EMAIL_FAILURES:5}
      max-ip-failures: ${AUTH_LOGIN_MAX_IP_FAILURES:20}
      failure-window-seconds: ${AUTH_LOGIN_FAILURE_WINDOW_SECONDS:300}
      lock-seconds: ${AUTH_LOGIN_LOCK_SECONDS:600}
  workspace:
    root-path: ${WORKSPACE_ROOT:./workspace}
  read-only-tools:
    max-file-bytes: ${READ_ONLY_TOOL_MAX_FILE_BYTES:131072}
    max-output-bytes: ${READ_ONLY_TOOL_MAX_OUTPUT_BYTES:262144}
    max-files: ${READ_ONLY_TOOL_MAX_FILES:200}
    redaction-enabled: ${READ_ONLY_TOOL_REDACTION_ENABLED:true}
    allow-prefixes: ${READ_ONLY_TOOL_ALLOW_PREFIXES:backend/src,frontend/src,docs,scripts,deploy,.github/workflows}
  model-gateway:
    default-provider: ${MODEL_GATEWAY_PROVIDER:MOCK}
    fallback-provider: MOCK
    fallback-enabled: true
    timeout-ms: ${MODEL_GATEWAY_TIMEOUT_MS:30000}
    retry-times: ${MODEL_GATEWAY_RETRY_TIMES:1}
    prompt-safety-enabled: true
    providers:
      mock:
        enabled: true
        model-name: mock-agent-model
      openai:
        enabled: ${OPENAI_ENABLED:false}
        base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
        api-key: ${OPENAI_API_KEY:}
        model-name: ${OPENAI_MODEL:gpt-4.1-mini}
      deepseek:
        enabled: ${DEEPSEEK_ENABLED:false}
        base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
        api-key: ${DEEPSEEK_API_KEY:}
        model-name: ${DEEPSEEK_MODEL:deepseek-chat}
      qwen:
        enabled: ${QWEN_ENABLED:false}
        base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        api-key: ${QWEN_API_KEY:}
        model-name: ${QWEN_MODEL:qwen-plus}
      claude:
        enabled: ${CLAUDE_ENABLED:false}
        base-url: ${CLAUDE_BASE_URL:https://api.anthropic.com}
        api-key: ${CLAUDE_API_KEY:}
        model-name: ${CLAUDE_MODEL:claude-3-5-sonnet-latest}
      gemini:
        enabled: ${GEMINI_ENABLED:false}
        base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
        api-key: ${GEMINI_API_KEY:}
        model-name: ${GEMINI_MODEL:gemini-2.5-flash}
  github:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8080/api/github/oauth/callback}
    scopes: ${GITHUB_OAUTH_SCOPES:repo,read:user,user:email}
  rag:
    enabled: true
    chat-enabled: true
    agent-enabled: true
    default-limit: 5
    max-context-chars: 4000
    max-chunk-chars: 800
  tool-worker:
    mode: ${TOOL_WORKER_MODE:SYNC_MOCK}
    queue-enabled: ${TOOL_WORKER_QUEUE_ENABLED:false}
    worker-enabled: ${TOOL_WORKER_ENABLED:false}
    exchange: ${TOOL_WORKER_EXCHANGE:tool.execution.exchange}
    queue: ${TOOL_WORKER_QUEUE:tool.execution.queue}
    routing-key: ${TOOL_WORKER_ROUTING_KEY:tool.execution.run}
    max-retry-count: ${TOOL_WORKER_MAX_RETRY_COUNT:2}
    dead-letter-exchange: ${TOOL_WORKER_DEAD_LETTER_EXCHANGE:tool.execution.dlx}
    dead-letter-queue: ${TOOL_WORKER_DEAD_LETTER_QUEUE:tool.execution.dlq}
    dead-letter-routing-key: ${TOOL_WORKER_DEAD_LETTER_ROUTING_KEY:tool.execution.dead}
    retry-delays-seconds: ${TOOL_WORKER_RETRY_DELAYS_SECONDS:5,30,120}
    running-timeout-seconds: ${TOOL_WORKER_RUNNING_TIMEOUT_SECONDS:300}
    poll-interval-ms: ${TOOL_WORKER_POLL_INTERVAL_MS:1500}

