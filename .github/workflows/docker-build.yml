name: Docker Build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: ai-coding-platform-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          load: true
          tags: ai-coding-platform-frontend:ci
          build-args: VITE_API_BASE_URL=""
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Login to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          REPO="ghcr.io/${{ github.repository_owner }}"

          docker tag ai-coding-platform-backend:ci "$REPO/ai-coding-platform-backend:${{ github.sha }}"
          docker tag ai-coding-platform-frontend:ci "$REPO/ai-coding-platform-frontend:${{ github.sha }}"

          docker tag ai-coding-platform-backend:ci "$REPO/ai-coding-platform-backend:${{ github.ref_name }}"
          docker tag ai-coding-platform-frontend:ci "$REPO/ai-coding-platform-frontend:${{ github.ref_name }}"

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker tag ai-coding-platform-backend:ci "$REPO/ai-coding-platform-backend:latest"
            docker tag ai-coding-platform-frontend:ci "$REPO/ai-coding-platform-frontend:latest"
          fi

          docker push "$REPO/ai-coding-platform-backend" --all-tags
          docker push "$REPO/ai-coding-platform-frontend" --all-tags
