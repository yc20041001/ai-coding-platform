# HTTP-only Nginx configuration for production
# Use this with Cloudflare Proxy (strict SSL), or for local testing.
# For direct HTTPS with Certbot, see nginx.https.conf.example.

upstream backend_upstream {
    server backend:8080;
    keepalive 32;
}

upstream frontend_upstream {
    server frontend:80;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Limit request size
    client_max_body_size 10m;

    # Static assets with long cache
    location /assets/ {
        proxy_pass http://frontend_upstream;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy to backend — SSE support
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE: disable all buffering and caching
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Actuator — internal healthcheck only (not exposed via nginx by default)
    # Uncomment to expose /actuator/health externally:
    # location /actuator/health {
    #     proxy_pass http://backend_upstream;
    #     proxy_set_header Host $host;
    # }

    # Vue Router history fallback — all non-asset, non-api requests go to index.html
    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
